<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Biblioteca Atenea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main class="contenedor">
        <section class="panel panel-form">
            <h1>Iniciar sesión</h1>
            <form id="form-login" class="formulario">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nombre@correo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" required>

                <p id="error-login" class="error"></p>
                <button type="submit" class="btn btn-bloque">Ingresar</button>
            </form>
            <p class="centrado">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
        </section>
    </main>

    <div id="mensaje" class="mensaje oculto"></div>

    <footer class="pie">
        <p>&copy; 2026 Biblioteca Atenea</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/paginas/login.js"></script>
</body>
</html>
