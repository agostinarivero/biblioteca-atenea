<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Biblioteca Atenea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main id="contenido" class="contenedor oculto">
        <section class="cabecera">
            <h1>Usuarios</h1>
            <p id="resumen" class="texto-suave">Alta de usuarios y cambio de contraseñas.</p>
        </section>

        <div class="dos-columnas">
            <div>
                <section class="panel">
                    <h2>Nuevo usuario</h2>
                    <form id="form-usuario" class="formulario">
                        <label for="nombre">Nombre y apellido</label>
                        <input type="text" id="nombre" maxlength="60">

                        <label for="email">Email</label>
                        <input type="email" id="email">

                        <label for="password">Contraseña (mínimo 6 caracteres)</label>
                        <input type="password" id="password">

                        <label for="role">Rol</label>
                        <select id="role">
                            <option value="USUARIO">USUARIO (socio)</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>

                        <p id="error-usuario" class="error"></p>
                        <button type="submit" class="btn">Crear usuario</button>
                    </form>
                </section>

                <!-- Se muestra al tocar "Cambiar contraseña" en la tabla -->
                <section id="panel-password" class="panel oculto">
                    <h2>Cambiar contraseña</h2>
                    <p id="usuario-elegido" class="texto-suave"></p>
                    <form id="form-password" class="formulario">
                        <label for="nueva">Nueva contraseña</label>
                        <input type="password" id="nueva">

                        <label for="confirmar">Repetir contraseña</label>
                        <input type="password" id="confirmar">

                        <p id="error-password" class="error"></p>
                        <div class="botones">
                            <button type="submit" class="btn">Guardar contraseña</button>
                            <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
                        </div>
                    </form>
                </section>
            </div>

            <section>
                <div class="filtros">
                    <div class="campo campo-busqueda">
                        <label for="buscador">Buscar</label>
                        <input type="search" id="buscador" placeholder="Nombre o email">
                    </div>
                    <div class="campo">
                        <label for="filtro-rol">Rol</label>
                        <select id="filtro-rol">
                            <option value="">Todos</option>
                            <option value="USUARIO">Socios</option>
                            <option value="ADMIN">Administradores</option>
                        </select>
                    </div>
                </div>
                <div class="panel tabla-contenedor">
                    <table class="tabla">
                        <thead>
                            <tr><th>Usuario</th><th>Rol</th><th>Préstamos activos</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-usuarios"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div id="mensaje" class="mensaje oculto"></div>

    <footer class="pie">
        <p>&copy; 2026 Biblioteca Atenea</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/paginas/admin-usuarios.js"></script>
</body>
</html>
