<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos - Biblioteca Atenea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main id="contenido" class="contenedor oculto">
        <section class="cabecera">
            <h1>Gestión de préstamos</h1>
            <p id="resumen" class="texto-suave">Confirmá entregas, registrá devoluciones y controlá vencimientos.</p>
        </section>

        <section class="filtros">
            <div class="campo campo-busqueda">
                <label for="buscador">Buscar</label>
                <input type="search" id="buscador" placeholder="Socio, email o libro">
            </div>
            <div class="campo">
                <label for="filtro-estado">Estado</label>
                <select id="filtro-estado">
                    <option value="">Todos</option>
                    <option value="Solicitado">Solicitado</option>
                    <option value="En préstamo">En préstamo</option>
                    <option value="Devuelto">Devuelto</option>
                    <option value="Vencido">Vencido</option>
                </select>
            </div>
            <div class="campo">
                <label for="orden">Ordenar por</label>
                <select id="orden">
                    <option value="reciente">Más recientes</option>
                    <option value="limite">Fecha límite más próxima</option>
                </select>
            </div>
        </section>

        <section class="panel tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Socio</th><th>Libro</th><th>Préstamo</th><th>Límite</th>
                        <th>Estado</th><th>Cambiar estado</th><th></th>
                    </tr>
                </thead>
                <tbody id="tabla-prestamos"></tbody>
            </table>
        </section>
    </main>

    <div id="mensaje" class="mensaje oculto"></div>

    <footer class="pie">
        <p>&copy; 2026 Biblioteca Atenea</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/paginas/admin-prestamos.js"></script>
</body>
</html>
